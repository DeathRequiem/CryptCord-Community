name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for CryptCord? Describe it below.

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: A clear description of the feature or improvement.
      placeholder: I'd like CryptCord to...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the use case or pain point this addresses.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative solutions you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Screenshots
      description: Anything else that might help — mockups, references, examples.
